[project]
name = "pyai-harness"
version = "0.1.0"
description = "A configurable AI coding agent harness built on Pydantic AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=2.52.0",
    "pydantic-ai-harness>=0.52.0",
]

[project.scripts]
pyai = "pyai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
